<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>消失的零用錢｜理財密室逃脫</title><style>
:root{--ink:#26324d;--cream:#fff8e9;--purple:#7354be;--yellow:#ffd56a;--mint:#92dfcb;--pink:#f7b2bd}*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Noto Sans TC',sans-serif;background:linear-gradient(145deg,#25234a,#4a3375);color:var(--ink)}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #f5ac32;outline-offset:2px}.app{max-width:1150px;margin:auto;padding:14px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#fff;flex-wrap:wrap}.brand{font-size:clamp(20px,3vw,30px);font-weight:900}.tag{font-size:12px;color:#dcd6f4}.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{background:#ffffff20;border:1px solid #ffffff35;padding:8px 12px;border-radius:14px;font-weight:750}.shell{background:#fff9ec;border:5px solid #dfc7ff;border-radius:25px;overflow:hidden;box-shadow:0 18px 45px #17142a77;margin-top:12px}.nav{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;background:#f2e8ff;gap:8px;flex-wrap:wrap}.nav strong{font-size:18px}.btn{background:#7051bb;color:white;border:0;border-radius:12px;padding:11px 15px;font-weight:850;box-shadow:0 4px 0 #503a8a}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #503a8a}.btn.secondary{background:#fff;color:#4c3d80;border:2px solid #c6b4ee;box-shadow:none}.btn.gold{background:#f6b83f;color:#49311a;box-shadow:0 4px 0 #bc8120}.btn:disabled{opacity:.45;cursor:not-allowed}.scene{position:relative;min-height:445px;overflow:hidden;background:linear-gradient(#d9edff 0 65%,#e1bc91 65% 100%)}.scene:before{content:'';position:absolute;inset:65% 0 auto;height:8px;background:#b48d6a}.scene.bank{background:linear-gradient(#d9e8f6 0 65%,#c3d3dc 65%)}.scene.shop{background:linear-gradient(#fff0df 0 65%,#ecc8b5 65%)}.window{position:absolute;left:8%;top:12%;width:19%;height:35%;background:linear-gradient(130deg,#a2d4ff,#d6f4ff);border:11px solid #fff;border-radius:12px;box-shadow:0 5px 0 #aa9fc4}.window:after{content:'☁️';position:absolute;top:15%;left:20%;font-size:34px}.rug{position:absolute;left:30%;bottom:5%;width:42%;height:17%;background:#efb9ca;border-radius:50%;border:7px solid #fff3}.object{position:absolute;border:3px solid #473957;background:#fff9ed;border-radius:17px;padding:10px;min-width:83px;min-height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 8px 0 #56416b30;transition:transform .15s}.object:hover{transform:translateY(-4px)}.object .emoji{font-size:clamp(29px,4vw,47px)}.object .name{font-size:13px;font-weight:900}.object.done{border-color:#58aa92;background:#e5fff4}.object.done:after{content:'✓';position:absolute;right:-7px;top:-10px;background:#40a582;color:#fff;border-radius:50%;width:23px;height:23px}.notice{position:absolute;bottom:12px;left:12px;right:12px;background:#fffefaed;padding:10px 13px;border-radius:12px;font-weight:700;max-width:690px;pointer-events:none}.bottom{display:grid;grid-template-columns:1.25fr 1fr;gap:12px;padding:12px;background:#fff8ed}.panel{background:#fff;border:2px solid #ecdfca;border-radius:15px;padding:12px}.panel h3{margin:0 0 8px;font-size:16px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:6px 9px;background:#f0e9ff;border-radius:10px;font-size:13px;font-weight:750}.task{font-size:13px;padding:5px 0;border-bottom:1px dashed #ddd}.task:last-child{border:0}.task.yes{color:#27836c}.overlay{position:fixed;inset:0;background:#1c1837ba;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}.modal{background:#fffdf5;border:5px solid #d3baff;border-radius:24px;padding:22px;max-width:680px;width:100%;max-height:94vh;overflow:auto;box-shadow:0 20px 65px #1119}.modal h2{margin:0 0 8px;color:#563a91}.modal p{line-height:1.65}.options{display:grid;gap:9px;margin:15px 0}.option{border:2px solid #d7c9ec;background:#f7f2ff;color:#352c55;text-align:left;border-radius:12px;padding:13px;font-weight:750}.option:hover{background:#e8ddff}.option.selected{border-color:#7354be;background:#e9ddff}.feedback{background:#edf9f0;border-left:5px solid #5baa7e;border-radius:8px;padding:12px;margin:10px 0}.feedback.bad{background:#fff1e9;border-color:#d88751}.small{font-size:13px;color:#695f78}.progress{height:12px;background:#e4d8f7;border-radius:10px;overflow:hidden}.progress span{display:block;height:100%;background:#7a59c5}.start{max-width:850px;margin:50px auto;background:#fff9eb;padding:28px;border-radius:28px;border:6px solid #d4baff;text-align:center}.start h1{font-size:clamp(30px,5vw,52px);margin:6px 0}.start .hero{font-size:76px}.start input{border:2px solid #c5b4e5;border-radius:12px;padding:12px;width:min(330px,100%);text-align:center}.endcard{text-align:center}.score{font-size:68px;color:#6849b1;font-weight:1000}.flex{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.hint{background:#fff4d7;border-radius:10px;padding:10px}.pill{background:#efe6ff;border-radius:20px;padding:7px 10px;font-size:13px;font-weight:700}.footer{color:#eee;text-align:center;font-size:12px;padding:12px}@media(max-width:700px){.scene{min-height:500px}.object{min-width:75px;min-height:75px;padding:5px}.object .name{font-size:11px}.bottom{grid-template-columns:1fr}.notice{font-size:12px}.modal{padding:15px}.top{justify-content:center}.brand{text-align:center}}
</style></head><body><div id="root"></div><script>
(()=>{'use strict';
const KEY='finance_escape_v1';const rooms=[{name:'我的房間',desc:'從凌亂的房間找到零用錢失蹤的線索。',cls:'',objects:[['desk','書桌','🗂️',9,53],['pig','存錢筒','🐷',36,34],['laptop','筆電','💻',63,31],['closet','衣櫃','👕',80,55],['door1','上鎖的門','🚪',86,10]]},{name:'網購調查室',desc:'檢查訂單、評論與消費證據，打開通往銀行的門。',cls:'shop',objects:[['cart','購物車','🛒',8,50],['reviews','評價牆','⭐',33,22],['parcel','神祕包裹','📦',61,54],['receipt','收據櫃','🧾',61,12],['exchange','外幣機','💱',35,56],['door2','安全閘門','🚪',83,21]]},{name:'理財銀行密室',desc:'完成資產配置，破解保險箱，找回理財智慧。',cls:'bank',objects:[['bank','存款櫃臺','🏦',8,49],['safe','保險箱','🔐',37,29],['risk','風險終端','📈',62,50],['budget','家庭帳本','📒',64,14],['exit','逃脫大門','🚪',84,13]]}];
const tasks={desk:{title:'支線｜遺失的記帳本',type:'choice',q:'你找到一張記帳單：零用錢500元，買文具120元、點心80元、遊戲貼紙150元。應剩多少錢？',opts:['150元','250元','350元'],answer:0,why:'500－120－80－150＝150元。記帳能幫助我們找出錢花在哪裡。',item:'記帳線索',points:55},pig:{title:'主線｜存錢筒暗號',type:'choice',q:'存錢筒旁寫著「先分辨需要和想要」。哪個選擇最符合理性消費？',opts:['先買限時特價品','先列預算，再買真正需要的用品','看網紅推薦就買'],answer:1,why:'消費前先設定預算、考慮需求，可以減少衝動購物。',item:'預算紙條',points:55},laptop:{title:'主線｜可疑訊息',type:'choice',q:'筆電跳出陌生賣家要求私下轉帳，還說「保證獲利」。你會？',opts:['立即匯款','先給對方身分證照片','停止交易，查證並可撥165諮詢'],answer:2,why:'165是反詐騙諮詢專線。不要輕信陌生連結或提供個資。',item:'安全通行碼',points:60},closet:{title:'支線｜衣櫃環保挑戰',type:'choice',q:'有件舊衣服仍可使用，最友善環境的做法是？',opts:['改造成布袋或繼續使用','直接丟棄再買新的','大量購買便宜新衣'],answer:0,why:'延長物品使用年限、改造再利用，有助減少垃圾與資源浪費。',item:'環保徽章',points:55},cart:{title:'支線｜購物車救援',type:'budget',q:'你有300元，必須買上課要用的筆記本(70元)和筆(30元)。還可以選一件商品，但總價不能超過300元。',items:[['筆記本（必需）',70,true],['原子筆（必需）',30,true],['水壺（舊的已壞）',150,false],['限定玩偶',250,false],['零食',60,false]],target:250,item:'精打細算徽章',points:65},reviews:{title:'支線｜假評論調查',type:'choice',q:'某商店評價全是同一天出現的五星短評，且沒有退貨資訊。最好的做法是？',opts:['立刻下單','比較多方評價、查商品與賣家資訊','只看五星數量'],answer:1,why:'網購前應查詢評價與信用、商品標示、售後服務及退換貨規定。',item:'查證報告',points:55},parcel:{title:'主線｜問題包裹',type:'choice',q:'收到的商品與訂購規格不符，應優先做什麼？',opts:['丟掉商品','保留購買證明，向賣家反映並依規定處理','把賣家資料公布到網路'],answer:1,why:'保存發票、訂單及對話紀錄，依適用規定提出退換貨要求；若有糾紛可尋求消費者服務中心協助。',item:'申訴證據',points:60},receipt:{title:'主線｜收據密碼鎖',type:'code',q:'櫃子貼著三筆購物紀錄：文具120元、衣物250元、餐點130元。總支出是幾元？輸入三位數密碼。',answer:'500',why:'120＋250＋130＝500。購物證明能幫助釐清消費爭議。',item:'收據檔案',points:65},exchange:{title:'支線｜外幣解碼',type:'code',q:'任務假設匯率：1美元＝30元新臺幣（僅供遊戲計算）。購買10美元的商品需多少元新臺幣？',answer:'300',why:'10×30＝300。實際匯率會變動，兌換前要查詢最新匯率及費用。',item:'匯率徽章',points:55},bank:{title:'主線｜儲蓄分流',type:'choice',q:'你需要隨時取用的緊急預備金，較適合放在哪裡？',opts:['全部投入股票','活期存款','全部鎖在長期定存'],answer:1,why:'活期存款方便隨時存取；定期存款通常有期限，股票價格可能波動。',item:'儲蓄鑰匙',points:60},risk:{title:'支線｜投資風險辨識',type:'choice',q:'有人說「買股票一定賺錢，完全沒有風險」，哪個判斷較正確？',opts:['股票可能獲利，也可能虧損','對方說保證就是真的','借錢投資一定比較快'],answer:0,why:'股票價格會波動。理財前應了解風險、費用及自己的承受能力。',item:'風險徽章',points:55},budget:{title:'主線｜家庭預算危機',type:'budget',q:'家庭這週可支配預算600元，必須支付食材300元與交通100元。請選擇合理支出，不要超支。',items:[['必要食材',300,true],['上學交通',100,true],['昂貴玩具',350,false],['額外點心',100,false],['備用文具',100,false]],target:500,item:'家庭帳本',points:65},safe:{title:'主線｜保險箱三道鎖',type:'sequence',q:'請依「風險相對較低 → 風險相對較高」排列：活期存款、定期存款、股票。',opts:['股票 → 定存 → 活存','活存 → 定存 → 股票','定存 → 股票 → 活存'],answer:1,why:'這是依教材所做的簡化比較：銀行存款通常風險較低，股票價格波動較大。存款也需考量條件與通膨。',item:'保險箱鑰匙',points:70}};
const base=()=>({name:'',room:0,done:{},items:[],score:0,coins:300,wrong:0,hints:0,help:0,steps:0,started:Date.now(),ended:false,visited:[0]});let s=base(),current=null,selection=[],answered=false,notice='點擊場景中的物件，探索線索並完成任務。';const $=x=>document.querySelector(x);const root=$('#root');
function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}function load(){try{let v=JSON.parse(localStorage.getItem(KEY)||'null');if(v&&v.done&&Array.isArray(v.items))s={...base(),...v}}catch(e){}}function earned(id,points,item){if(s.done[id])return;s.done[id]=true;s.score=Math.min(900,s.score+points);s.coins+=40;s.items.push(item);notice='獲得「'+item+'」與40枚探索金幣！';save()}
const roomReq={door1:['desk','pig','laptop'],door2:['parcel','receipt','reviews'],exit:['bank','safe','budget']};function canDoor(id){return roomReq[id].every(k=>s.done[k])}function tasksDone(){return Object.keys(tasks).filter(k=>s.done[k]).length}function allMain(){return ['desk','pig','laptop','parcel','receipt','reviews','bank','safe','budget'].every(k=>s.done[k])}function points(){return Math.min(1000,s.score+(s.ended?105:0))}function htmlSafe(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){if(!s.name){root.innerHTML=`<div class="start"><div class="hero">🕵️‍♀️💰🔐</div><h1>消失的零用錢</h1><h2>理財密室逃脫</h2><p>零用錢不見了！調查三個房間，找出收據、破解密碼、識破網購陷阱。完成支線任務可獲得更多分數。</p><p>🧩 3間密室　⭐ 13項主支線任務　🏆 滿分1000分</p><input id="name" maxlength="16" placeholder="輸入座號或暱稱（勿填全名）"><p><button class="btn gold" id="start">開始偵探任務 →</button></p><p class="small">遊戲進度僅儲存在此瀏覽器。所有任務可重試，不會因金幣不足卡關。</p></div>`;$('#start').onclick=()=>{s.name=$('#name').value.trim()||'小偵探';save();render()};return}let r=rooms[s.room];root.innerHTML=`<div class="app"><header class="top"><div><div class="brand">🔎 消失的零用錢</div><div class="tag">理財密室逃脫 · ${htmlSafe(s.name)}</div></div><div class="stats"><div class="stat">🏆 ${points()}/1000</div><div class="stat">🪙 ${s.coins}</div><div class="stat">🧩 ${tasksDone()}/13</div></div></header><main class="shell"><div class="nav"><div><strong>${['🏠','🛍️','🏦'][s.room]} ${r.name}</strong><div class="small">${r.desc}</div></div><div class="flex"><button class="btn secondary" id="help">💡 提示</button><button class="btn secondary" id="reset">重新開始</button></div></div><section class="scene ${r.cls}"><div class="window"></div><div class="rug"></div>${r.objects.map(o=>`<button class="object ${s.done[o[0]]?'done':''}" data-obj="${o[0]}" style="left:${o[3]}%;top:${o[4]}%"><span class="emoji">${o[2]}</span><span class="name">${o[1]}</span></button>`).join('')}<div class="notice">📣 ${htmlSafe(notice)}</div></section><div class="bottom"><div class="panel"><h3>🎒 線索背包</h3><div class="chips">${s.items.length?s.items.map(i=>`<span class="chip">${htmlSafe(i)}</span>`).join(''):'<span class="small">尚未找到線索，點擊物件開始探索</span>'}</div><p class="small">線索不需要花金幣購買；完成挑戰還可獲得探索金幣。</p></div><div class="panel"><h3>📋 本區主線進度</h3>${roomReq[['door1','door2','exit'][s.room]].map(k=>`<div class="task ${s.done[k]?'yes':''}">${s.done[k]?'✓':'○'} ${tasks[k].title.replace('主線｜','')}</div>`).join('')}<div class="progress"><span style="width:${tasksDone()/13*100}%"></span></div></div></div></main><div class="footer">支線任務可自由探索；答錯可重試，提示會小幅扣分。無網路也能遊玩。</div></div>`;document.querySelectorAll('[data-obj]').forEach(b=>b.onclick=()=>openObject(b.dataset.obj));$('#help').onclick=hint;$('#reset').onclick=()=>{modal('重新開始？',`<p>重新開始將清除這台裝置目前的遊戲進度。</p><div class="flex"><button class="btn" id="confirmReset">確認重來</button><button class="btn secondary" id="close">取消</button></div>`);$('#confirmReset').onclick=()=>{s=base();save();close();render()};$('#close').onclick=close};if(s.ended)end()}
function modal(title,body){close();let el=document.createElement('div');el.className='overlay';el.id='overlay';el.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><h2>${title}</h2>${body}</div>`;document.body.appendChild(el)}function close(){let el=$('#overlay');if(el)el.remove()}function openObject(id){if(s.ended)return;if(id==='door1'||id==='door2'||id==='exit'){if(!canDoor(id)){modal('🔒 門還鎖著',`<p>需要先完成這些主線任務：</p>${roomReq[id].map(k=>`<p>${s.done[k]?'✅':'🔲'} ${tasks[k].title}</p>`).join('')}<button class="btn secondary" id="close">繼續探索</button>`);$('#close').onclick=close;return}if(id==='exit'){s.ended=true;save();end();return}s.room=id==='door1'?1:2;s.visited.push(s.room);notice='成功解鎖！你進入了'+rooms[s.room].name+'。';save();render();return}if(s.done[id]){modal('已完成的線索',`<p>你已找到「${htmlSafe(tasks[id].item)}」。</p><p class="feedback">${tasks[id].why||'你完成了合理的預算分配。'}</p><button class="btn secondary" id="close">返回房間</button>`);$('#close').onclick=close;return}current=id;selection=[];answered=false;showTask()}
function showTask(){let t=tasks[current];let body=`<p>${htmlSafe(t.q)}</p>`;if(t.type==='choice'||t.type==='sequence')body+=`<div class="options">${t.opts.map((o,i)=>`<button class="option" data-choice="${i}">${htmlSafe(o)}</button>`).join('')}</div>`;if(t.type==='code')body+=`<input id="code" inputmode="numeric" maxlength="6" placeholder="輸入數字密碼" style="width:100%;padding:14px;border:2px solid #cbb8ea;border-radius:12px"><p><button class="btn gold" id="submitCode">開鎖</button></p>`;if(t.type==='budget')body+=`<p class="small">請點選要購買的商品（必要項目必須選取）。</p><div class="options">${t.items.map((x,i)=>`<button class="option" data-budget="${i}">${x[2]?'📌 ':''}${x[0]} · ${x[1]}元</button>`).join('')}</div><div class="pill" id="total">已選：0元</div><p><button class="btn gold" id="submitBudget">確認分配</button></p>`;body+=`<div id="feedback"></div><div class="flex"><button class="btn secondary" id="back">先去探索其他地方</button><button class="btn secondary" id="taskHint">任務提示（扣5分）</button></div>`;modal(t.title,body);$('#back').onclick=close;$('#taskHint').onclick=()=>{s.hints++;s.score=Math.max(0,s.score-5);save();$('#feedback').innerHTML=`<p class="hint">💡 ${t.type==='code'?'把題目中的金額相加或相乘。':t.type==='budget'?'先滿足必要支出，再檢查是否超過預算。':'先找出符合教材觀念、最安全且合理的選項。'}</p>`;renderHeaderOnly()};document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>submitChoice(Number(b.dataset.choice)));if($('#submitCode'))$('#submitCode').onclick=()=>submitCode();document.querySelectorAll('[data-budget]').forEach(b=>b.onclick=()=>{let i=Number(b.dataset.budget);selection=selection.includes(i)?selection.filter(x=>x!==i):[...selection,i];b.classList.toggle('selected');$('#total').textContent='已選：'+selection.reduce((a,i)=>a+t.items[i][1],0)+'元'});if($('#submitBudget'))$('#submitBudget').onclick=submitBudget}
function renderHeaderOnly(){let el=document.querySelector('.stat');if(el)el.textContent='🏆 '+points()+'/1000'}function incorrect(msg){s.wrong++;s.score=Math.max(0,s.score-5);save();$('#feedback').innerHTML=`<div class="feedback bad">❗ ${msg} 可以再試一次，不會卡關。答錯扣5分。</div>`;renderHeaderOnly()}function correct(){let t=tasks[current];earned(current,t.points,t.item);$('#feedback').innerHTML=`<div class="feedback">🎉 破解成功！獲得 ${t.points} 分、40金幣與「${htmlSafe(t.item)}」。<p>${htmlSafe(t.why||'先滿足必要支出、控制預算，才能穩健管理金錢。')}</p></div><button class="btn gold" id="continue">繼續探索 →</button>`;document.querySelectorAll('.option,#submitCode,#submitBudget').forEach(x=>x.disabled=true);$('#continue').onclick=()=>{close();render()}}function submitChoice(i){let t=tasks[current];i===t.answer?correct():incorrect('再想想：這個選擇可能忽略了預算、權益或風險。')}function submitCode(){let t=tasks[current];($('#code').value||'').trim()===t.answer?correct():incorrect('密碼不對，請重新計算。')}function submitBudget(){let t=tasks[current],sum=selection.reduce((a,i)=>a+t.items[i][1],0),must=t.items.map((x,i)=>x[2]?i:-1).filter(i=>i>=0);if(must.every(i=>selection.includes(i))&&sum<=t.target&&sum>0)correct();else incorrect('請選齊必要支出，且總額不超過任務規定的預算。')}
function hint(){let ids=rooms[s.room].objects.map(o=>o[0]).filter(k=>tasks[k]&&!s.done[k]);let main=ids.find(k=>tasks[k].title.includes('主線'))||ids[0];if(!main){notice='本區任務已完成！請點擊上鎖的門前往下一區。';render();return}modal('💡 偵探提示',`<p>建議先探索「${rooms[s.room].objects.find(o=>o[0]===main)[1]}」，找到通往下一間密室的關鍵線索。</p><p class="small">提示不消耗金幣。進入任務後若需要解題提示，每次扣5分。</p><button class="btn" id="close">知道了</button>`);$('#close').onclick=close}
function end(){let total=points(),completed=tasksDone(),rating=total>=850?'理財偵探大師':total>=650?'精明消費偵探':'理財見習偵探';modal('🎊 成功逃出理財密室！',`<div class="endcard"><div style="font-size:65px">🏆🔓🎉</div><h2>${htmlSafe(s.name)}，恭喜破案！</h2><div class="score">${total}<span style="font-size:24px"> / 1000</span></div><h3>${rating}</h3><p>完成任務 ${completed}/13｜答錯 ${s.wrong} 次｜解題提示 ${s.hints} 次</p><p>你找回的不是消失的鈔票，而是「會管理金錢、辨識風險」的能力！</p><p class="small">計分：13項任務共最高775分；成功逃脫加105分；另外120分由支線探索完整度獎勵補足。答錯或使用解題提示各扣5分。</p><div class="flex" style="justify-content:center"><button class="btn gold" id="screen">列印／儲存成績</button><button class="btn secondary" id="again">重新挑戰</button><button class="btn secondary" id="close">查看房間</button></div></div>`);$('#screen').onclick=()=>window.print();$('#again').onclick=()=>{s=base();save();close();render()};$('#close').onclick=close}
// 13個任務原始配分總和為780；支線探索完整度加分最高120，逃脫加105。
const oldEarn=earned;earned=function(id,p,item){oldEarn(id,p,item);let sides=['closet','cart','exchange','risk'];if(sides.includes(id)){s.score=Math.min(900,s.score+30);save()}};
load();render();
})();
</script></body></html>
